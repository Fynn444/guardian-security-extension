name: Guardian Security CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate manifest.json
        run: |
          node -e "
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));

          if (manifest.manifest_version !== 3) {
            throw new Error('manifest.json must use Manifest V3');
          }

          if (!manifest.version) {
            throw new Error('manifest.json is missing a version');
          }

          console.log('Manifest valid:', manifest.name, manifest.version);
          "

      - name: Check JavaScript syntax
  shell: bash
  run: |
    set -e

    echo "Checking JavaScript files..."

    while IFS= read -r -d '' file; do
      echo "Checking $file"
      node --check "$file"
    done < <(find . -type f -name "*.js" \
      -not -path "./.git/*" \
      -print0)

    echo "All JavaScript files passed syntax validation."

      - name: Check for analyzer regression tests
        shell: bash
        run: |
          if [ -f "tests/analyzer.test.js" ]; then
            echo "Running analyzer regression tests..."
            node tests/analyzer.test.js
          else
            echo "No analyzer regression test suite found yet."
            echo "Skipping regression tests."
          fi
