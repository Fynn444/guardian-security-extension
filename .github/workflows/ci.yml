name: Guardian Security CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate manifest.json
        run: |
          node -e "
          const fs = require('fs');
          const manifest = JSON.parse(
            fs.readFileSync('manifest.json', 'utf8')
          );

          if (manifest.manifest_version !== 3) {
            throw new Error('manifest.json must use Manifest V3');
          }

          if (!manifest.version) {
            throw new Error('manifest.json is missing a version');
          }

          console.log(
            'Manifest valid:',
            manifest.name,
            manifest.version
          );
          "

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e

          echo "Checking JavaScript files..."

          found=0

          while IFS= read -r file; do
            found=1
            echo "Checking: $file"
            node --check "$file"
          done < <(
            find . \
              -type f \
              -name "*.js" \
              -not -path "./.git/*"
          )

          if [ "$found" -eq 0 ]; then
            echo "No JavaScript files were found."
            exit 1
          fi

          echo "All JavaScript files passed syntax validation."

      - name: Run analyzer regression tests when available
        shell: bash
        run: |
          if [ -f "tests/analyzer.test.js" ]; then
            echo "Running tests/analyzer.test.js"
            node tests/analyzer.test.js

          elif [ -f "analyzer.test.js" ]; then
            echo "Running analyzer.test.js"
            node analyzer.test.js

          else
            echo "Analyzer regression test file is not currently present."
            echo "Skipping this step for now."
          fi

      - name: CI summary
        run: |
          echo "Guardian Security validation completed successfully."
