name: Guardian Security CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate manifest.json
        run: |
          node -e "
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));

          if (manifest.manifest_version !== 3) {
            throw new Error('manifest.json must use Manifest V3');
          }

          if (!manifest.version) {
            throw new Error('manifest.json is missing a version');
          }

          console.log('Manifest valid:', manifest.name, manifest.version);
          "

      - name: Check JavaScript syntax
        run: |
          node --check background.js
          node --check content.js
          node --check lib/analyzer.js
          node --check lib/defaults.js
          node --check blocked.js
          node --check popup.js
          node --check options.js

      - name: Run analyzer regression tests
        run: |
          node tests/analyzer.test.js
